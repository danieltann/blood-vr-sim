<!DOCTYPE html>
<html>
  <head>
    <title>O-Level G3: Phagocytosis in Action</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-sky color="#400000"></a-sky>

      <a-sphere id="whiteCell" position="-4 2 -10" radius="2" color="#ffffff" opacity="0.9"
                animation="property: position; to: 4 2 -10; dur: 5000; dir: alternate; loop: true; easing: easeInOutSine">
      </a-sphere>
      <a-text value="Phagocyte (Engulfing Bacteria)" position="-2 5 -10" color="white"></a-text>

      <a-capsule position="-4 2 -9.5" radius="0.2" height="0.8" color="#33cc33"
                  animation="property: position; to: 4 2 -9.5; dur: 5000; dir: alternate; loop: true; easing: easeInOutSine">
      </a-capsule>

      <a-entity position="0 0 -5">
        <a-sphere scale="1 0.3 1" color="#cc0000" position="-3 0 -2" 
                  animation="property: position; to: 10 0 -2; dur: 8000; loop: true"></a-sphere>
        <a-sphere scale="1 0.3 1" color="#cc0000" position="2 4 -4" 
                  animation="property: position; to: 10 4 -4; dur: 6000; loop: true"></a-sphere>
      </a-entity>

      <a-entity position="0 2 -3">
          <a-text value="Syllabus K325: Phagocytosis\nWhite blood cells engulf and\ndigest foreign microorganisms." 
                  align="center" width="4" color="#FFCCCC"></a-text>
      </a-entity>

      <a-light type="ambient" intensity="0.6"></a-light>
      <a-light type="point" position="2 4 -2" intensity="0.8"></a-light>

      <a-entity camera look-controls position="0 1.6 0"></a-entity>
    </a-scene>
  </body>
</html>
