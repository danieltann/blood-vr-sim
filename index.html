<!DOCTYPE html>
<html>
  <head>
    <title>O-Level G3 Biology: Blood & Clotting VR</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene background="color: #4a0505">

      <a-entity position="-2 1.6 -3" rotation="20 40 0">
        <a-entity position="0 0 0">
          <a-torus color="#b30000" radius="0.5" tube="0.15" scale="1 1 0.4"></a-torus>
          <a-sphere color="#660000" radius="0.38" scale="1 1 0.1"></a-sphere> </a-entity>
        <a-entity position="-0.3 0.8 -0.5" rotation="60 0 30">
          <a-torus color="#b30000" radius="0.5" tube="0.15" scale="1 1 0.4"></a-torus>
          <a-sphere color="#660000" radius="0.38" scale="1 1 0.1"></a-sphere>
        </a-entity>
        <a-text value="RED BLOOD CELLS\nBiconcave discs\nNo nucleus" align="center" position="0 -0.8 0" width="3" color="#fff"></a-text>
      </a-entity>


      <a-entity position="2 1.6 -3">
        <a-sphere radius="0.8" color="#ffffff" opacity="0.5" transparent="true">
          <a-sphere radius="0.2" color="#3a005c" position="0.2 0.1 0"></a-sphere>
          <a-sphere radius="0.18" color="#3a005c" position="-0.1 -0.2 0.1"></a-sphere>
          <a-sphere radius="0.15" color="#3a005c" position="-0.1 0.2 -0.1"></a-sphere>
        </a-sphere>
        <a-text value="WHITE BLOOD CELL\n(Phagocyte)\nLobed nucleus inside" align="center" position="0 -1 0" width="3" color="#fff"></a-text>
      </a-entity>


      <a-entity position="0 1.6 -5.5">
        
        <a-cylinder color="#e6e6cca" height="5" radius="0.02" rotation="0 0 45"></a-cylinder>
        <a-cylinder color="#e6e6cca" height="5" radius="0.02" rotation="0 0 -45"></a-cylinder>
        <a-cylinder color="#e6e6cca" height="5" radius="0.02" rotation="0 0 90"></a-cylinder>
        <a-cylinder color="#e6e6cca" height="5" radius="0.02" rotation="45 90 0"></a-cylinder>
        <a-cylinder color="#e6e6cca" height="5" radius="0.02" rotation="-45 90 0"></a-cylinder>

        <a-dodecahedron color="#ffb700" radius="0.1" position="0.2 0.5 0.2"></a-dodecahedron>
        <a-dodecahedron color="#ffb700" radius="0.08" position="-0.4 -0.3 0.1"></a-dodecahedron>
        <a-dodecahedron color="#ffb700" radius="0.12" position="0.1 -0.6 -0.2"></a-dodecahedron>

        <a-entity position="0.2 0.1 0" rotation="45 10 20">
          <a-torus color="#800000" radius="0.4" tube="0.12" scale="1 1 0.4"></a-torus>
          <a-sphere color="#4a0000" radius="0.3" scale="1 1 0.1"></a-sphere>
        </a-entity>
        
        <a-entity position="-0.5 0.5 -0.1" rotation="15 70 80">
          <a-torus color="#800000" radius="0.4" tube="0.12" scale="1 1 0.4"></a-torus>
          <a-sphere color="#4a0000" radius="0.3" scale="1 1 0.1"></a-sphere>
        </a-entity>

        <a-text value="BLOOD CLOT MECHANISM\nPlatelets trigger Fibrin mesh\nto trap moving cells" align="center" position="0 1.8 0" width="4" color="#ffb700"></a-text>
      </a-entity>


      <a-light type="ambient" intensity="0.7" color="#fff"></a-light>
      <a-light type="directional" intensity="0.5" position="1 3 2"></a-light>
      
      <a-entity camera look-controls position="0 1.6 0"></a-entity>

    </a-scene>
  </body>
</html>
