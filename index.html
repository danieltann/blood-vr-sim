<!DOCTYPE html>
<html>
  <head>
    <title>3D Blood Composition: G3 Syllabus</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-sky color="#300000"></a-sky>

      <a-entity position="0 2 -4" animation="property: rotation; to: 360 360 0; loop: true; dur: 12000; easing: linear">
        <a-torus color="#990000" radius="0.6" tube="0.3" scale="1 1 0.4"></a-torus>
        <a-sphere color="#990000" radius="0.4" scale="1 1 0.2"></a-sphere>
      </a-entity>

      <a-torus-knot id="phagocyte" position="-3 3 -8" radius="1.2" tube="0.4" p="2" q="3" color="#ffffff" opacity="0.9"
                    animation="property: rotation; to: 0 360 0; loop: true; dur: 20000; easing: linear">
      </a-torus-knot>
      
      <a-capsule position="3 2 -8" radius="0.2" height="1" color="#44ff44"
                 animation="property: position; to: -2 3 -8; dur: 8000; dir: alternate; loop: true; easing: easeInOutQuad">
      </a-capsule>

      <a-dodecahedron color="#ffcc00" radius="0.2" position="1 1 -3"
                      animation="property: rotation; to: 360 0 360; loop: true; dur: 5000"></a-dodecahedron>

      <a-entity position="0 0 -2">
        <a-text value="RED BLOOD CELL:\nBiconcave shape increases\nsurface area for O2." align="center" width="3" position="-2 0.5 -1"></a-text>
        <a-text value="PHAGOCYTE:\nChanges shape to engulf\npathogens." align="center" width="3" position="2 0.5 -1"></a-text>
      </a-entity>

      <a-light type="ambient" color="#ffaaaa"></a-light>
      <a-light type="point" intensity="1.5" position="2 4 4"></a-light>
      <a-entity camera look-controls position="0 1.6 0"></a-entity>
    </a-scene>
  </body>
</html>
