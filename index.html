<!DOCTYPE html>
<html>
  <head>
    <title>O-Level Biology: Focused Morphology & Clotting VR</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script>
      // Component to ensure all quiz buttons behave identically on gaze
      AFRAME.registerComponent('quiz-option', {
        init: function () {
          var el = this.el;
          el.addEventListener('mouseenter', function () {
            // Uniform 'hover' effect for all options
            this.setAttribute('material', 'color', '#ffb700'); 
          });
          el.addEventListener('mouseleave', function () {
            // Restore uniform 'inactive' state for all options
            this.setAttribute('material', 'color', '#2c3e50');
          });
          el.addEventListener('click', function () {
            // Optional: Provide feedback only on correct answer (Option B)
            if (el.id === 'optionB') {
                document.querySelector('#quizFeedback').setAttribute('text', 'value: CORRECT! Platelets turn spiky upon activation.');
                document.querySelector('#quizFeedback').setAttribute('text', 'color', '#2ecc71');
            } else {
                document.querySelector('#quizFeedback').setAttribute('text', 'value: INCORRECT. Try Again.');
                document.querySelector('#quizFeedback').setAttribute('text', 'color', '#e74c3c');
            }
          });
        }
      });
    </script>
  </head>
  <body>
    <a-scene>
      
      <a-sky color="#05080d"></a-sky> <a-cylinder radius="6" height="60" rotation="90 0 0" position="0 0 -15" color="#5c0000" side="double" open-ended="true"></a-cylinder>

      <a-circle color="#1a0000" radius="1.3" scale="1.5 0.8 1" position="0 -5.9 -15" rotation="-90 0 0"></a-circle>

      <a-plane color="#0b132b" width="2.6" height="3.4" position="-3.6 2.0 -4.5" rotation="0 35 0" opacity="0.95" transparent="true">
        <a-text value="G3 MORPHOLOGY GUIDE" align="center" color="#f1c40f" width="4.5" position="0 1.4 0.01"></a-text>
        <a-text value="• RED BLOOD CELL\n  Biconcave disc, no nucleus.\n  Shape maximizes Surface Area\n  for faster diffusion.\n\n• WHITE BLOOD CELLS\n  Defense cells with nuclei.\n  Phagocyte: Lobed.\n  Lymphocyte: Large/Round.\n\n• PLATELETS (Thrombocytes)\n  Fragments that transform\n  visibly during clotting." 
                align="left" color="#ecf0f1" width="3.0" position="-1.2 0 0.01"></a-text>
      </a-plane>

      <a-entity animation="property: position; from: 0 0 -30; to: 0 0 20; dur: 16000; loop: true; easing: linear">
        
        <a-entity position="2 1.2 -3" rotation="30 10 40">
          <a-torus color="#cc0000" radius="0.4" tube="0.12" scale="1 1 0.4"></a-torus>
          <a-sphere color="#7f0000" radius="0.30" scale="1 1 0.15"></a-sphere>
        </a-entity>
        <a-entity position="-2.5 3.0 -6" rotation="10 70 20">
          <a-torus color="#cc0000" radius="0.4" tube="0.12" scale="1 1 0.4"></a-torus>
          <a-sphere color="#7f0000" radius="0.30" scale="1 1 0.15"></a-sphere>
        </a-entity>
        <a-entity position="0.8 4.0 -9" rotation="80 20 10">
          <a-torus color="#cc0000" radius="0.4" tube="0.12" scale="1 1 0.4"></a-torus>
          <a-sphere color="#7f0000" radius="0.30" scale="1 1 0.15"></a-sphere>
        </a-entity>
        <a-entity position="-1.5 0.8 -12" rotation="45 45 80">
          <a-torus color="#cc0000" radius="0.4" tube="0.12" scale="1 1 0.4"></a-torus>
          <a-sphere color="#7f0000" radius="0.30" scale="1 1 0.15"></a-sphere>
        </a-entity>

        <a-entity position="-2.2 1.8 -8" scale="0.9 0.9 0.9">
          <a-sphere radius="1" color="#ffffff" opacity="0.4" transparent="true">
            <a-sphere radius="0.25" color="#2a004a" position="0.2 0.1 0"></a-sphere>
            <a-sphere radius="0.23" color="#2a004a" position="-0.1 -0.2 0.1"></a-sphere>
            <a-sphere radius="0.20" color="#2a004a" position="-0.1 0.2 -0.1"></a-sphere>
          </a-sphere>
        </a-entity>

        <a-entity position="2.2 2.2 -10" scale="0.85 0.85 0.85">
          <a-sphere radius="1" color="#ffffff" opacity="0.4" transparent="true">
            <a-sphere radius="0.65" color="#000033" position="0 0 0"></a-sphere>
          </a-sphere>
        </a-entity>

        <a-octahedron color="#ffb300" radius="0.08" position="-0.8 2.2 -4" rotation="10 20 30"></a-octahedron>
        <a-octahedron color="#ffa000" radius="0.07" position="1.4 1.5 -7" rotation="40 50 10"></a-octahedron>
        <a-octahedron color="#ffb300" radius="0.08" position="-1.5 3.8 -14" rotation="5 80 45"></a-octahedron>
      </a-entity>

      <a-entity position="0 1.6 -12">
        <a-cylinder color="#cccccc" height="6" radius="0.02" rotation="0 0 45" opacity="0.8" transparent="true"></a-cylinder>
        <a-cylinder color="#cccccc" height="6" radius="0.02" rotation="0 0 -45" opacity="0.8" transparent="true"></a-cylinder>
        <a-cylinder color="#cccccc" height="6" radius="0.02" rotation="45 90 0" opacity="0.8" transparent="true"></a-cylinder>
        
        <a-entity position="0.3 0.1 0" rotation="40 20 10">
          <a-torus color="#b30000" radius="0.4" tube="0.12" scale="1 1 0.4"></a-torus>
          <a-sphere color="#660000" radius="0.30" scale="1 1 0.15"></a-sphere>
        </a-entity>
        <a-entity position="-0.4 -0.5 0.1" rotation="10 80 45">
          <a-torus color="#b30000" radius="0.4" tube="0.12" scale="1 1 0.4"></a-torus>
          <a-sphere color="#660000" radius="0.30" scale="1 1 0.15"></a-sphere>
        </a-entity>

        <a-entity position="0.2 0.6 0.2" animation="property: rotation; from: 0 0 0; to: 0 360 0; dur: 8000; loop: true; easing: linear">
            <a-icosahedron color="#ff9f43" radius="0.18" rotation="0 0 0" scale="1 1.5 1"></a-icosahedron>
            <a-icosahedron color="#ff9f43" radius="0.18" rotation="90 0 45" scale="1 1.5 1"></a-icosahedron>
            <a-icosahedron color="#ff9f43" radius="0.18" rotation="45 90 90" scale="1 1.5 1"></a-icosahedron>
        </a-entity>
        
        <a-entity position="-0.3 0.3 -0.2" animation="property: rotation; from: 0 0 0; to: 360 0 360; dur: 6000; loop: true; easing: linear">
            <a-icosahedron color="#ff6b6b" radius="0.16" rotation="0 0 0" scale="1 1.5 1"></a-icosahedron>
            <a-icosahedron color="#ff6b6b" radius="0.16" rotation="45 45 45" scale="1 1.5 1"></a-icosahedron>
        </a-entity>

        <a-text value="Platelet Clot Response" position="0 2.2 0" align="center" width="4.5" color="#ffffff"></a-text>
      </a-entity>

      <a-entity position="0 1.8 -18">
        <a-plane color="#111" width="4.5" height="2.2" opacity="0.95" transparent="true">
          <a-text value="G3 MORPHOLOGY QUIZ" align="center" color="#f1c40f" width="5" position="0 0.8 0.01"></a-text>
          <a-text value="Question: How does the morphology of a platelet change during\nthe clotting response to a blood vessel injury?\n\n[Gaze at your selection to submit answer]" 
                  align="center" color="#ffffff" width="3.6" position="0 0.1 0.01"></a-text>
        </a-plane>
        
        <a-entity id="optionBZone" position="0.8 -0.6 0.05">
            <a-box id="optionB" quiz-option width="1.6" height="0.25" depth="0.1" color="#2c3e50">
                <a-text value="Turn Spiky" align="center" position="0 0 0.06" width="3.2" color="#fff"></a-text>
            </a-box>
        </a-entity>
        
        <a-entity id="optionAZone" position="-0.8 -0.6 0.05">
            <a-box id="optionA" quiz-option width="1.6" height="0.25" depth="0.1" color="#2c3e50">
                <a-text value="Turn Flat" align="center" position="0 0 0.06" width="3.2" color="#fff"></a-text>
            </a-box>
        </a-entity>

        <a-text id="quizFeedback" value="" align="center" width="4" position="0 -1 0"></a-text>
      </a-entity>

      <a-entity id="cameraRig" position="0 1.6 0">
        <a-entity camera look-controls wasd-controls>
          <a-cursor color="#ffffff" raycaster="objects: a-box" fuse="true" fuse-timeout="1500"></a-cursor>
        </a-entity>
      </a-entity>

      <a-light type="ambient" intensity="0.65" color="#ffffff"></a-light>
      <a-light type="directional" intensity="0.55" position="2 5 3"></a-light>

    </a-scene>
  </body>
</html>
